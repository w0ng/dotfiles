# Neovide GUI settings, kept in step with ghostty/.config/ghostty/config so
# Neovide and nvim-inside-ghostty look identical.
#
# Only the settings Neovide *cannot* take from Lua live here. Everything it
# exposes as a g: variable (cursor colour, ANSI palette, ⌘ clipboard keys) is in
# the NEOVIDE section of nvim/.config/nvim/init.lua instead.

[font]
size = 18.0

# ghostty picks faces by style: Medium for normal, ExtraBold for bold. macOS
# reports all 16 Maple Mono faces under the one family "Maple Mono NF CN",
# so the style has to be named explicitly - 'guifont' takes a family and a size
# only, and would resolve to Regular. Setting 'guifont' anywhere overrides this
# whole [font] table, so leave it unset.
[[font.normal]]
family = "Maple Mono NF CN"
style = "Medium"

[[font.bold]]
family = "Maple Mono NF CN"
style = "ExtraBold"

[[font.italic]]
family = "Maple Mono NF CN"
style = "Medium Italic"

[[font.bold_italic]]
family = "Maple Mono NF CN"
style = "ExtraBold Italic"
