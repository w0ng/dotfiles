# ~/.config/herdr/config.toml — terminal multiplexer for coding agents.
#
# Only settings that differ from herdr's defaults are listed; run `herdr` and
# open the settings pane (prefix+`) to see the full set with their defaults.

# Skip the first-run notification walkthrough.
onboarding = false

[theme]
name = "gruvbox"

# The base theme leaves the sidebar too uniform to scan: active and inactive
# entries only differ in weight. These pull them apart on the gruvbox palette.
[theme.custom]
text     = "#fabd2f"   # active space/agent title — gruvbox yellow
subtext0 = "#928374"   # inactive space/agent title — gruvbox grey
surface0 = "#1d2021"

[terminal]
# Empty would mean $SHELL, which is stale inside a session started before the
# login shell last changed.
default_shell = "zsh"

[keys]
# Matches tmux, so the same finger habit works in either.
prefix = "ctrl+a"
settings = "prefix+`"
detach = "prefix+d"
open_worktree = "prefix+shift+o"   # prefix+o is taken by open_notification_target

# Workspace and agent cycling, unbound by default.
previous_workspace = "prefix+comma"
next_workspace = "prefix+period"
previous_agent = "prefix+shift+comma"
next_agent = "prefix+shift+period"

# prefix+s to split, matching this repo's tmux binding; herdr's default is
# prefix+minus.
split_horizontal = "prefix+s"

# Navigate mode: hjkl for workspaces. Pane movement is left unbound so the
# arrow keys keep it, rather than shadowing h and l inside the picker.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

[worktrees]
# Where `New worktree` puts checkouts. Machine-specific: herdr has no config
# include mechanism, so set this in the local copy on machines that need a
# path outside the repo's own directory.
# directory = "~/work/trees"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.toast]
# Ghostty posts the banner itself, so it carries Ghostty's icon and clicking it
# activates Ghostty and focuses the surface that fired it. The escape sequence
# also rides an ssh connection home, so this one value covers local sessions and
# `herdr --remote <host>` alike. "system" would shell out to osascript, landing
# as Script Editor with a click that goes nowhere, and does not exist on Linux.
delivery = "terminal"

[ui.sound]
enabled = true

[session]
# Resume agent panes into their own conversation sessions after a server
# restart, rather than leaving dead shells behind.
resume_agents_on_restore = true

[experimental]
pane_history = true
