#
# ~/.config/tmux/tmux.conf
#

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v
bind v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize by one line at a time, like vim. Hold the key to move further.
bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

# Pane switching with C-hjkl, no prefix.
#
# A root-table binding swallows the key outright, so both escapes matter. When
# the pane is running nvim or fzf the key is sent on, which is what keeps nvim's
# own <C-w>hjkl window moves (init.lua maps C-hjkl to them) and fzf's list
# navigation working inside tmux. At an edge it is also sent on rather than
# dropped -- otherwise C-l could never clear the screen, since a single-pane
# window sits at all four edges.
#
# The editor test is a format, not the `ps` pipeline vim-tmux-navigator ships:
# same answer for a local editor without forking ps on every keypress.
set -g @nav_pass '#{m/ri:^(view|n?vim?x?|fzf)(diff)?$,#{pane_current_command}}'
bind-key -n 'C-h' if-shell -F '#{E:@nav_pass}' { send-keys C-h } { if-shell -F '#{pane_at_left}'   { send-keys C-h } { select-pane -L } }
bind-key -n 'C-j' if-shell -F '#{E:@nav_pass}' { send-keys C-j } { if-shell -F '#{pane_at_bottom}' { send-keys C-j } { select-pane -D } }
bind-key -n 'C-k' if-shell -F '#{E:@nav_pass}' { send-keys C-k } { if-shell -F '#{pane_at_top}'    { send-keys C-k } { select-pane -U } }
bind-key -n 'C-l' if-shell -F '#{E:@nav_pass}' { send-keys C-l } { if-shell -F '#{pane_at_right}'  { send-keys C-l } { select-pane -R } }

bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# vi-style controls for copy mode
set-window-option -g mode-keys vi

# change prefix key
unbind C-b
set-option -g prefix C-a

# remove escape key delay
set-option -g escape-time 0

# status bar
set-option -g status-bg black
set-option -g status-fg white
set-option -g status-left ""
set-option -g status-right ""
set-window-option -g window-status-bell-style bg=black,fg=brightred
set-window-option -g window-status-current-style fg=brightyellow

# dynamic window title
set-option -g set-titles on

# set first window to 1 instead of 0
set-option -g base-index 1

# tmux-256color is the correct inner terminal for programs running inside tmux
set -g default-terminal "tmux-256color"
# tmux's built-in feature table does not list ghostty, so hyperlinks (OSC 8)
# are stripped unless tmux is told the outer terminal handles them.
set -as terminal-features ",xterm-ghostty:hyperlinks"
# No terminal-overrides for true colour, italics, strikethrough, undercurl or
# underline colour: xterm-ghostty's terminfo already declares Tc, sitm, smxx,
# Smulx and Setulc, so the `*:` overrides only restated them -- and `*:Tc`
# asserted true colour for every terminal, including any that lacks it. Add one
# back only for a terminal whose own terminfo is missing the capability.

# start visual selection like vim.
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi Enter

# macOS vs Linux devboxes: default shell path and clipboard tool differ.
# Homebrew's zsh on macOS, not /bin/zsh -- bootstrap installs it and makes it the
# login shell, so a pane running the pinned system 5.9 instead would be a
# silent version split between inside and outside tmux.
if-shell "uname | grep -q Darwin" {
  set -g default-shell /opt/homebrew/bin/zsh
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  set -g default-shell /usr/bin/zsh
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# allow OSC 52 clipboard passthrough (e.g. yanking back to the Mac over ssh)
set -g allow-passthrough on
set -s set-clipboard on

# pane borders (gruvbox palette, heavy lines for visibility)
set -g pane-border-style fg=#504945
set -g pane-active-border-style fg=#d79921
set -g pane-border-lines heavy

# Tmux Plugin Manager. tpm itself is deliberately not declared as a @plugin:
# it comes from a Homebrew formula, and listing it would have tpm clone a second
# copy of itself into the plugin directory for nothing.
# restore tmux environment after system restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on' # restoring pane contents
# automatic tmux start/restore when computer/server is turned on
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'       # auto-restore on tmux server start
set -g @continuum-save-interval '15' # save every 15 mins (default)

# Initialise tpm (keep at the very bottom of tmux.conf). Homebrew's copy on
# macOS; anywhere else, whatever clone the host has under the tmux config dir.
# Both guarded, so a machine with neither still starts a clean tmux.
if-shell '[ -x /opt/homebrew/opt/tpm/share/tpm/tpm ]' {
  run '/opt/homebrew/opt/tpm/share/tpm/tpm'
} {
  if-shell '[ -x "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm" ]' {
    run '~/.config/tmux/plugins/tpm/tpm'
  }
}
