# ~/.config/aerospace/aerospace.toml: tiling window manager.
# Commands and options: https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

# Both of these only make sense while AeroSpace is running, and there is no hook
# to stop them again. Every callback AeroSpace offers fires on startup, login,
# or a state change (focus, monitor, mode, workspace, window), and none on exit.
# So they outlive it, and quitting them is `killall borders sketchybar` by hand.
after-startup-command = [
  # JankyBorders: highlight the focused window. Gruvbox dark, matching the
  # terminal, with bright yellow (#fabd2f) active and dark1 (#3c3836) inactive.
  'exec-and-forget borders active_color=0xfffabd2f inactive_color=0xff3c3836 width=8.0 style=round',
  'exec-and-forget sketchybar',
]

start-at-login = false
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'accordion'   # tiles|accordion
default-root-container-orientation = 'auto'   # horizontal|vertical|auto

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Makes cmd-h a no-op rather than hiding a window out of the tiling tree, where
# it is awkward to get back.
automatically-unhide-macos-hidden-apps = true

# Kept alive while empty so the sketchybar pill row never changes width.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

#
# sketchybar callbacks. The bar has no way to poll AeroSpace, so every piece of
# state it shows has to be pushed to it from here.
#
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_change']
# Fires when focus moves between a floating and a tiled window, which changes
# the layout indicator.
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_layout_change']
# One script rather than a command per pill, because it makes the single
# AeroSpace query the whole row needs and paints all ten itself. It has to be a
# script, since inlining the command substitution here fails to parse as TOML.
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '$HOME/.config/sketchybar/plugins/aerospace_workspace_change.sh',
]

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

#
# Gaps, sized so the 8px JankyBorders border exactly fills them. It draws
# roughly 4px outside the window frame.
#
# The top gap also clears sketchybar, so on an external monitor it is the bar's
# height plus that same 4px: 32 + 4. Keep it in step with `height=` in
# sketchybar/.config/sketchybar/sketchybarrc; nothing derives one from the
# other, so a change there leaves either a strip of desktop above the windows or
# windows tucked underneath the bar.
#
# The built-in panel gets the plain 4px instead, because macOS already reserves
# the menu bar area there and sketchybar draws inside it, so a second bar's worth of
# clearance would be dead space. "built-in" is a case-insensitive regex
# substring, since AeroSpace has no keyword for the laptop panel, and it matches
# this Mac's "Built-in Retina Display". The trailing value is the default for
# everything that does not match.
#
gaps.inner.horizontal = 4
gaps.inner.vertical =   4
gaps.outer.left =       4
gaps.outer.bottom =     4
gaps.outer.top =        [{ monitor."built-in" = 4 }, 36]
gaps.outer.right =      4

#
# Apps whose windows are dialog-shaped, fixed-size, or want their own aspect
# ratio, where a tile is the wrong shape. Everything else tiles. `alt-shift-f`
# toggles a window by hand, so try an app that way before earning it a line
# here.
#
# These blocks have to stay above [mode.main.binding]. TOML reads an
# array-of-tables that follows a table header as nested inside it, so moving
# them down redefines the keybinding table instead.
#
# `app-id` is an exact bundle ID; `aerospace list-apps` prints it for anything
# running. The blocks sit in app-id order so a new one has an obvious home.
# Exact IDs never overlap, so nothing but reading depends on it.
#
[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'pl.maketheweb.cleanshotx'
run = 'layout floating'

[mode.main.binding]

    # Layout. Each also nudges sketchybar, which cannot see the change itself.
    alt-slash = ['layout tiles horizontal vertical', 'exec-and-forget sketchybar --trigger aerospace_layout_change']
    alt-comma = ['layout accordion horizontal vertical', 'exec-and-forget sketchybar --trigger aerospace_layout_change']
    alt-f = ['fullscreen --no-outer-gaps', 'exec-and-forget sketchybar --trigger aerospace_layout_change']
    alt-shift-f = ['layout floating tiling', 'exec-and-forget sketchybar --trigger aerospace_layout_change']

    # Focus and move, vim-style.
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'

    # Send the focused window to a workspace and follow it. --focus-follows-window
    # is per-command, because there is a focus-follows-mouse setting but no
    # focus-follows-window one, so the flag has to be repeated on each line.
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
    alt-shift-0 = 'move-node-to-workspace --focus-follows-window 0'

    # Same, but stay put, for parking a window somewhere without losing focus.
    alt-ctrl-shift-1 = 'move-node-to-workspace 1'
    alt-ctrl-shift-2 = 'move-node-to-workspace 2'
    alt-ctrl-shift-3 = 'move-node-to-workspace 3'
    alt-ctrl-shift-4 = 'move-node-to-workspace 4'
    alt-ctrl-shift-5 = 'move-node-to-workspace 5'
    alt-ctrl-shift-6 = 'move-node-to-workspace 6'
    alt-ctrl-shift-7 = 'move-node-to-workspace 7'
    alt-ctrl-shift-8 = 'move-node-to-workspace 8'
    alt-ctrl-shift-9 = 'move-node-to-workspace 9'
    alt-ctrl-shift-0 = 'move-node-to-workspace 0'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

    # Launch-or-focus, alt-<letter>. `open -a` raises an app that is already
    # running, so these double as an app switcher.
    alt-a = 'exec-and-forget open -a Claude'
    alt-b = 'exec-and-forget b="$(cat "$HOME/.config/aerospace/browser.local" 2>/dev/null)"; open -a "${b:-Brave Browser}"'
    alt-c = 'exec-and-forget open -a Calendar'
    alt-d = 'exec-and-forget open -a Discord'
    alt-e = 'exec-and-forget open -a Finder'
    alt-g = 'exec-and-forget open -a ChatGPT'
    alt-i = 'exec-and-forget open -a Messages'
    alt-m = 'exec-and-forget open -a Mail'
    alt-o = 'exec-and-forget open -a Obsidian'
    alt-p = 'exec-and-forget open -a 1Password'
    alt-s = 'exec-and-forget open -a Slack'
    alt-t = 'exec-and-forget open -a Ghostty'
    alt-v = 'exec-and-forget open -a Neovide'
    alt-w = 'exec-and-forget open -a WhatsApp'
    alt-x = 'exec-and-forget open -a Spotify'
    alt-z = 'exec-and-forget open -a zoom.us'

# Escape hatch for layout surgery; alt-shift-semicolon enters it, esc leaves.
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
