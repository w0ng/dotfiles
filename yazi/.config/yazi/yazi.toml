[mgr]
# A wider preview than yazi's default [1, 4, 3]. The preview pane is the whole
# reason to run this over `ls`, and at this width a PDF page or a source file
# is readable rather than merely present.
ratio = [1, 3, 4]

sort_by         = "natural"
sort_sensitive  = false
sort_reverse    = false
sort_dir_first  = true
linemode        = "size"
show_hidden     = false
show_symlink    = true
scrolloff       = 5

[preview]
# Ceilings on the pixel size yazi decodes to, counted in *physical* pixels.
# Whichever is smaller, these or the pane, wins, and yazi only shrinks to fit
# — it never enlarges. So on a 2x display a low ceiling is what bites: the
# stock 600 left a 600px image stranded in the top-left of a ~2990px pane.
# Set clear of the widest pane this setup can produce (6K display, fullscreen,
# the ratio above), so the pane is always the real limit; higher still is free
# for that same reason, which is why these are not tuned to the exact pixel.
max_width  = 4000
max_height = 4000
wrap       = "yes"
